<!DOCTYPE html>
<html lang="ja">　
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clock Weather Calendar Ticker</title>

<style>
* { box-sizing: border-box; }
body { margin:0; background:black; color:white; font-family:Arial,sans-serif; overflow:hidden; }
#top-ticker { height:38px; padding:4px 10px; background:#111; border-bottom:1px solid #333; overflow:hidden; }
#news-line { position:relative; height:29px; line-height:29px; font-size:24px; color:#ddd; overflow:hidden; white-space:nowrap; }
#news-scroll { position:absolute; left:100%; white-space:nowrap; animation:scroll-left 30s linear infinite; }
@keyframes scroll-left { from { transform:translateX(0); } to { transform:translateX(calc(-100% - 100vw)); } }
.container { height:calc(100vh - 38px); display:flex; flex-direction:column; padding:8px 12px 10px; gap:8px; }
.summary { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-shrink:0; padding-bottom:8px; border-bottom:1px solid #444; }
#time { font-size:clamp(36px,7vw,76px); font-weight:bold; line-height:1.1; letter-spacing:-2px; font-variant-numeric:tabular-nums; white-space:nowrap; }
#date { font-size:clamp(17px,2.8vw,30px); white-space:nowrap; }
#weather { display:flex; align-items:center; gap:8px; font-size:clamp(19px,3vw,32px); white-space:nowrap; }
#weather-temp { font-weight:bold; }
.calendars { flex:1; min-height:0; display:flex; gap:14px; }
.month { flex:1; min-width:0; display:flex; flex-direction:column; }
.calendar-title { text-align:center; font-size:clamp(20px,3vw,30px); line-height:1.2; margin:0 0 6px; }
.calendar { flex:1; width:100%; border-collapse:collapse; table-layout:fixed; }
.calendar th,.calendar td { border:1px solid #444; text-align:center; padding:2px; font-size:clamp(18px,2.8vw,30px); }
.calendar thead { height:12%; }
.calendar tbody tr { height:14.666%; }
.sun { color:#ff8080; } .sat { color:#7fb3ff; }
.holiday { color:#ff4040; font-weight:bold; }
.calendar .today { background:white; color:black; font-weight:bold; }
@media(max-width:700px) { .summary { flex-wrap:wrap; justify-content:center; column-gap:20px; row-gap:4px; } #time { font-size:42px; } #date { font-size:20px; } #weather { font-size:23px; } .container { padding:6px; gap:6px; } .calendars { gap:8px; } }
@media(max-height:450px) { #time { font-size:36px; } #date,#weather { font-size:20px; } .calendar-title { font-size:20px; } .calendar th,.calendar td { font-size:18px; } }
</style>
</head>

<body>
    
<div id="top-ticker">
    <div id="news-line">
        <div id="news-scroll">読み込み中...</div>
    </div>
</div>

<main class="container">
<header class="summary"><div id="time"></div><div id="weather"><span id="weather-icon">☀️</span><span id="weather-temp">--℃</span><span id="weather-rain">☔--%</span></div><div id="date"></div></header>
<section class="calendars" aria-label="今月と来月のカレンダー">
<section class="month"><h2 class="calendar-title" id="calendar-title-0"></h2><table class="calendar" aria-labelledby="calendar-title-0"><thead><tr><th class="sun">日</th><th>月</th><th>火</th><th>水</th><th>木</th><th>金</th><th class="sat">土</th></tr></thead><tbody id="calendar-body-0"></tbody></table></section>
<section class="month"><h2 class="calendar-title" id="calendar-title-1"></h2><table class="calendar" aria-labelledby="calendar-title-1"><thead><tr><th class="sun">日</th><th>月</th><th>火</th><th>水</th><th>木</th><th>金</th><th class="sat">土</th></tr></thead><tbody id="calendar-body-1"></tbody></table></section>
</section></main>
<script>
function updateClock() {
    const now = new Date();

    const time =
        String(now.getHours()).padStart(2, '0') + ":" +
        String(now.getMinutes()).padStart(2, '0') + ":" +
        String(now.getSeconds()).padStart(2, '0');

    const week = ["日","月","火","水","木","金","土"];

    const date =
        now.getFullYear() + "年" +
        (now.getMonth() + 1) + "月" +
        now.getDate() + "日 (" + week[now.getDay()] + ")";

    document.getElementById("time").textContent = time;
    document.getElementById("date").textContent = date;
}

function buildCalendar(offset, now = new Date()) {
    const target = new Date(now.getFullYear(), now.getMonth() + offset, 1);
    const year = target.getFullYear();
    const month = target.getMonth();

    document.getElementById("calendar-title-" + offset).textContent =
        year + "年 " + (month + 1) + "月";

    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();

    const tbody = document.getElementById("calendar-body-" + offset);
    tbody.innerHTML = "";

    let dateNum = 1;

    for (let week = 0; week < 6; week++) {
        const tr = document.createElement("tr");

        for (let day = 0; day < 7; day++) {
            const td = document.createElement("td");

            if (week === 0 && day < firstDay) {
                td.textContent = "";
            } else if (dateNum > lastDate) {
                td.textContent = "";
            } else {
                td.textContent = dateNum;

                const monthStr = String(month + 1).padStart(2, "0");
                const dayStr = String(dateNum).padStart(2, "0");
                const dateKey = `${year}-${monthStr}-${dayStr}`;

                if (holidays[dateKey]) td.classList.add("holiday");
                if (day === 0) td.classList.add("sun");
                if (day === 6) td.classList.add("sat");
                if (year === now.getFullYear() && month === now.getMonth() && dateNum === now.getDate()) td.classList.add("today");

                dateNum++;
            }

            tr.appendChild(td);
        }

        tbody.appendChild(tr);


    }
}

let holidays = {};

async function loadHolidays(year) {
    try {
        const res = await fetch(`https://holidays-jp.github.io/api/v1/${year}/date.json`);
        if (!res.ok) throw new Error("holiday fetch failed");
        Object.assign(holidays, await res.json());
    } catch (e) {
        console.log("祝日取得失敗");
        // 取得済みの祝日は保持する。
    }
}

async function loadWeather() {
    try {
        const res = await fetch(
            "https://api.open-meteo.com/v1/forecast?latitude=35.68&longitude=139.76&current_weather=true&hourly=precipitation_probability"
        );
        const data = await res.json();

        const temp = Math.round(data.current_weather.temperature);
        const code = data.current_weather.weathercode;

        const nowHour = new Date().getHours();
        const rain = data.hourly.precipitation_probability[nowHour];

        const icon = getWeatherIcon(code);

        document.getElementById("weather-icon").textContent = icon;
        document.getElementById("weather-temp").textContent = `${temp}℃`;
        document.getElementById("weather-rain").textContent = `☔${rain}%`;

    } catch (e) {
        document.getElementById("weather-icon").textContent = "❓";
        document.getElementById("weather-temp").textContent = "--℃";
        document.getElementById("weather-rain").textContent = "☔--%";
    }
}

function getWeatherIcon(code) {
    if (code === 0) return "☀️";
    if (code <= 3) return "⛅";
    if (code <= 48) return "☁️";
    if (code <= 67) return "🌧";
    if (code <= 77) return "🌨";
    if (code <= 99) return "⛈";
    return "❓";
}

/* ---------------------------
   相場・ニュース表示
--------------------------- */

// 公開CORSプロキシ経由でテキスト取得
async function fetchTextViaProxy(url) {
    const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(url);
    const res = await fetch(proxyUrl);
    if (!res.ok) throw new Error("fetch failed");
    return await res.text();
}

// HTML文字列から数値っぽいものを拾う簡易関数
function extractLastNumber(html) {
    const cleaned = html.replace(/\s+/g, " ");
    const match = cleaned.match(/Last.*?([0-9][0-9,]*\.?[0-9]*)/i);
    return match ? match[1] : null;
}

async function loadNews() {
    try {
        // NHK主要ニュース RSS
        const rssText = await fetchTextViaProxy("https://www.nhk.or.jp/rss/news/cat0.xml");
        const parser = new DOMParser();
        const xml = parser.parseFromString(rssText, "application/xml");

        const items = xml.querySelectorAll("item title");
        const headlines = [];

        for (let i = 0; i < items.length && headlines.length < 2; i++) {
            const t = items[i].textContent.trim();
            if (t) headlines.push(t);
        }

        const text = headlines.length >= 2
            ? `${headlines[0]}　／　${headlines[1]}　　◆　　`
            : ((headlines[0] || "最新ニュース取得失敗") + "　　◆　　");

        const loopText = text + text;

        const el = document.getElementById("news-scroll");
        el.textContent = loopText;

        // 文字数に応じて速度を少し調整
        const duration = Math.max(20, loopText.length * 0.4);
        el.style.animationDuration = duration + "s";

    } catch (e) {
        const el = document.getElementById("news-scroll");
        el.textContent = "最新ニュースを取得できませんでしたた　　◆　　最新ニュースを取得できませんでした　　◆　　";
        el.style.animationDuration = "25s";
    }
}

async function loadTopInfo() {
    await loadNews();
}

let calendarDateKey = "";
let calendarRequest = 0;
async function refreshCalendars() {
    const request = ++calendarRequest;
    const now = new Date();
    calendarDateKey = now.toDateString();
    buildCalendar(0, now);
    buildCalendar(1, now);
    const nextMonth = new Date(now.getFullYear(), now.getMonth() + 1, 1);
    await Promise.all([...new Set([now.getFullYear(), nextMonth.getFullYear()])].map(loadHolidays));
    if (request !== calendarRequest) return;
    buildCalendar(0, now);
    buildCalendar(1, now);
}
updateClock();
refreshCalendars();
loadWeather();
loadTopInfo();

// 擬似クリック（Silk対策）
setInterval(() => {
    document.body.dispatchEvent(new Event("touchstart"));
}, 45000);

setInterval(() => {
    updateClock();
    if (new Date().toDateString() !== calendarDateKey) refreshCalendars();
}, 1000);
setInterval(loadWeather, 600000);
setInterval(loadTopInfo, 300000);

// 定期フルリロード
const FULL_RELOAD_MS = 5 * 60 * 1000;
setTimeout(() => {
    location.reload();
}, FULL_RELOAD_MS);
</script>

</body>
</html>
